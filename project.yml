name: HcIOS
options:
  bundleIdPrefix: dev.nguyenhuy158
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: 0.12.1
targets:
  HcIOS:
    type: application
    platform: iOS
    sources:
      - HcIOS
    dependencies:
      - package: Citadel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nguyenhuy158.hcios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock hc to see your terminals.
        INFOPLIST_KEY_CFBundleDisplayName: hc
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
