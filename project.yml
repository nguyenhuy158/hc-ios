name: HcIOS
options:
  bundleIdPrefix: dev.nguyenhuy158
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.12.1
targets:
  HcIOS:
    type: application
    platform: iOS
    sources:
      - HcIOS
    dependencies:
      - package: Citadel
    info:
      path: HcIOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: dev.nguyenhuy158.hcios
            CFBundleURLSchemes: [hcios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nguyenhuy158.hcios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock hc to see your terminals.
        INFOPLIST_KEY_CFBundleDisplayName: hc
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
  HcIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HcIOSTests
    dependencies:
      - target: HcIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HcIOS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HcIOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
  HcIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HcIOSUITests
    dependencies:
      - target: HcIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        TEST_TARGET_NAME: HcIOS
schemes:
  HcIOS:
    build:
      targets:
        HcIOS: all
        HcIOSTests: [test]
        HcIOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HcIOSTests
        - HcIOSUITests
